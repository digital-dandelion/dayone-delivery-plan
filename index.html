<script>
(async function(){
  const SALT = Uint8Array.from(atob("VLkndy4gcys3eO3JkJSfWw=="), c=>c.charCodeAt(0));
  const IV = Uint8Array.from(atob("yl5oyULoZrEBmxmn"), c=>c.charCodeAt(0));
  const ROUNDS = 600000;
  const data = Uint8Array.from(atob(document.getElementById('locked').textContent.trim()), c=>c.charCodeAt(0));
  async function unlock(pw){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:SALT, iterations:ROUNDS, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:IV}, key, data);
    return new TextDecoder().decode(plain);
  }
  async function open(pw){
    const html = await unlock(pw);
    try { sessionStorage.setItem('px-pw', pw); } catch(e) {}
    document.open(); document.write(html); document.close();
  }
  document.getElementById('f').addEventListener('submit', async e=>{
    e.preventDefault(); const err=document.getElementById('err'); err.textContent='Opening…';
    try { await open(document.getElementById('pw').value); } catch(x) { err.textContent='That password did not open the page.'; }
  });
  try { const saved = sessionStorage.getItem('px-pw'); if(saved) open(saved).catch(()=>{}); } catch(e) {}
})();
</script>
